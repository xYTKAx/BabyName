
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff4f6">
    <title>Наш бейбик ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="top">
            <div class="logo">♥</div>
            <div>
                <h1>Наш бейбик</h1>
                <p>Выбираем с любовью</p>
            </div>
        </header>

        <button class="room-home-button" id="room-home-button" type="button" hidden aria-label="Вернуться в комнату">⌂</button>

        <div id="screen">
            <div class="loading">Готовим ваше пространство…</div>
        </div>

        <p class="footer">Только вы двое и ваши любимые имена ❤️</p>
    </main>
    <nav class="bottom-nav" id="bottom-nav" hidden aria-label="Навигация"><button data-view="choose">♡<small>Выбор</small></button><button data-view="matches">♥<small>Совпадения</small></button><button data-view="favorites">★<small>Избранное</small></button></nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
